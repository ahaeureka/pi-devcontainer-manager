name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-runtime:
    name: real Docker + CLI + Pi runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19]
    env:
      DEVCONTAINER_CLI_PATH: node_modules/@devcontainers/cli/devcontainer.js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install pinned deps (incl. @devcontainers/cli@0.88.0)
        run: npm ci

      # The pinned CLI needs Docker-in-Docker on the runner. GitHub-hosted
      # ubuntu-latest has a docker daemon (DOCKER_HOST) via the runner image.
      - name: Verify docker daemon
        run: docker info

      - name: Integration suite (real Docker + CLI via capability gate)
        run: npx vitest run tests/integration

      - name: E2E suite (real Docker + CLI via capability gate)
        run: npx vitest run tests/e2e

      # Real Pi runtime smoke: the packed-artifact checks always run; the script
      # self-skips its model-touching step (named reason) when no provider is
      # configured. NOT gated on `secrets.PI_PROVIDER` — `secrets` is unavailable
      # in `if:`, and referencing it makes GitHub reject this whole workflow file.
      - name: Packed Pi runtime smoke (self-skips the model step without PI_PROVIDER)
        env:
          PI_PROVIDER: ${{ secrets.PI_PROVIDER }}
          PI_MODEL: ${{ secrets.PI_MODEL }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: node scripts/smoke-pi-package.mjs

  # The smoke step above self-skips its model-touching part when no provider is
  # configured (named reason, exit 0); this job reports the outcome so the
  # workflow stays green without a live provider.
  report-skip:
    name: report capability skips
    runs-on: ubuntu-latest
    needs: [real-runtime]
    if: ${{ always() }}
    steps:
      - run: |
          echo "Integration job status: ${{ needs.real-runtime.result }}"
          echo "Packed Pi smoke self-skips its model step unless PI_PROVIDER is set."
